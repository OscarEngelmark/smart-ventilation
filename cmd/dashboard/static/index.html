<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Ventilation</title>
<link rel="stylesheet" href="uPlot.min.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #1e1e1e; color: #d4d4d4; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 20px 0 4px; }
  #status { color: #9d9d9d; font-size: 0.9rem; }
  #status.error { color: #f85149; }
  .now { display: flex; flex-wrap: wrap; gap: 32px; margin: 16px 0; }
  .now div { color: #9d9d9d; font-size: 0.9rem; }
  .now span { display: block; color: #d4d4d4; font-size: 1.6rem; }
  .now span.speed { display: inline; color: inherit; font-size: inherit; }
</style>
</head>
<body>
<h1>Smart Ventilation, <span id="room"></span></h1>
<div id="status">Loading…</div>
<div class="now">
  <div>Room time <span class="speed" id="speed"></span><span id="now-time">–</span></div>
  <div>CO2<span id="now-co2">–</span></div>
  <div>People<span id="now-people">–</span></div>
  <div>Damper level<span id="now-damper">–</span></div>
</div>
<h2>CO2 (ppm)</h2>
<div id="co2"></div>
<h2>People in the room</h2>
<div id="people"></div>
<h2>Damper level (0 closed, 1 fully open)</h2>
<div id="damper"></div>

<script src="uPlot.iife.min.js"></script>
<script>
const tz = "Europe/Stockholm"; // the time zone the room's office hours follow
const refreshMs = 5000; // real time between refreshes
const chartHeight = 220;
const stepped = uPlot.paths.stepped({ align: 1 }); // each value holds until the next
const axis = { stroke: "#9d9d9d", grid: { stroke: "#333" }, ticks: { stroke: "#333" } };

// seconds turns a stored timestamp into Unix seconds, the time unit uPlot uses.
const seconds = ts => Date.parse(ts) / 1000;

// getJSON fetches path and reads the answer as JSON, failing on an error status.
async function getJSON(path) {
  const resp = await fetch(path);
  if (!resp.ok) {
    const where = path.split("?")[0]; // the query string would only lengthen the message
    throw new Error(`${where}: ${resp.status} ${await resp.text()}`);
  }
  return resp.json();
}

// held turns values that each hold until the next into a line from since to latest.
function held(points, since, latest) {
  const xs = points.map(p => Math.max(p.t, since)); // a value from before since starts at since
  const ys = points.map(p => p.v);
  if (ys.length > 0) {
    xs.push(latest);
    ys.push(ys[ys.length - 1]);
  }
  return [xs, ys];
}

// makeChart draws an empty chart inside the element with the given id.
function makeChart(id, series, yRange) {
  const el = document.getElementById(id);
  const opts = {
    width: el.clientWidth,
    height: chartHeight,
    tzDate: ts => uPlot.tzDate(new Date(ts * 1000), tz),
    scales: { x: { time: true }, y: { range: yRange } },
    series: [{}, ...series],
    axes: [axis, axis], // x axis, then y axis
  };
  const empty = [[], ...series.map(() => [])];
  return new uPlot(opts, empty, el);
}

// formatTime writes Unix seconds as a weekday, date and time in the room's zone.
function formatTime(s) {
  return new Date(s * 1000).toLocaleString("en-GB", {
    timeZone: tz, weekday: "short", day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit",
  });
}

// refresh fetches the page's settings and the room's recent history, and
// redraws every chart with it.
async function refresh(charts) {
  const config = await getJSON("config"); // read every time, so a new session's speed shows
  document.getElementById("room").textContent = config.room;
  document.getElementById("speed").textContent = `(${config.speed}×)`;

  const latestResp = await fetch("api/latest");
  if (latestResp.status === 204) {
    throw new Error("nothing stored yet");
  }
  const latestText = (await latestResp.text()).trim();
  if (!latestResp.ok) {
    throw new Error(`api/latest: ${latestResp.status} ${latestText}`);
  }
  const latest = seconds(latestText); // newest stored room time
  const since = latest - config.window_seconds;
  const query = new URLSearchParams({
    room: config.room,
    since: new Date(since * 1000).toISOString(),
  });
  const [co2, people, commands] = await Promise.all([
    getJSON(`api/co2?${query}`),
    getJSON(`api/occupancy?${query}`),
    getJSON(`api/commands?${query}`),
  ]);

  const co2Times = co2.map(r => seconds(r.ts));
  charts.co2.setData([
    co2Times,
    co2.map(r => r.ppm),
    co2Times.map(() => config.target_ppm),
    co2Times.map(() => config.threshold_ppm),
  ]);
  const counts = people.map(r => ({ t: seconds(r.ts), v: r.count }));
  charts.people.setData(held(counts, since, latest));
  const levels = commands.map(c => ({ t: seconds(c.ts), v: c.level }));
  charts.damper.setData(held(levels, since, latest));
  for (const chart of Object.values(charts)) {
    chart.setScale("x", { min: since, max: latest }); // same time span on every chart
  }

  document.getElementById("now-time").textContent = formatTime(latest);
  const lastCO2 = co2.at(-1);
  const lastCount = people.at(-1);
  const lastCommand = commands.at(-1);
  document.getElementById("now-co2").textContent = lastCO2 ? `${Math.round(lastCO2.ppm)} ppm` : "–";
  document.getElementById("now-people").textContent = lastCount ? lastCount.count : "–";
  document.getElementById("now-damper").textContent = lastCommand ? lastCommand.level.toFixed(2) : "–";
}

// setStatus shows a line under the heading, in red when it reports an error.
function setStatus(text, isError) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = isError ? "error" : "";
}

function main() {
  const charts = {
    co2: makeChart("co2", [
      { label: "CO2", stroke: "#58a6ff", width: 2 },
      { label: "Target", stroke: "#d29922", dash: [6, 4] },
      { label: "Threshold", stroke: "#f85149", dash: [6, 4] },
    ], (u, min, max) => [Math.min(400, min), Math.max(1100, max + 50)]),
    people: makeChart("people", [
      { label: "People", stroke: "#3fb950", width: 2, paths: stepped },
    ], (u, min, max) => [0, Math.max(1, max) + 1]),
    damper: makeChart("damper", [
      { label: "Damper level", stroke: "#a371f7", width: 2, paths: stepped },
    ], [0, 1.05]),
  };
  window.addEventListener("resize", () => {
    for (const chart of Object.values(charts)) {
      chart.setSize({ width: chart.root.parentElement.clientWidth, height: chartHeight });
    }
  });

  async function tick() {
    try {
      await refresh(charts);
      setStatus(`Updated ${new Date().toLocaleTimeString("en-GB")} (real time)`, false);
    } catch (err) {
      setStatus(`Could not update: ${err.message}`, true);
    }
    setTimeout(tick, refreshMs); // the next refresh starts once this one has finished
  }
  tick();
}

main();
</script>
</body>
</html>
