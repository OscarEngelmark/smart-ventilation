# The addresses containers reach each other by, written once and reused below.
x-buildsim-url: &buildsim-url http://buildsim:9090
x-broker-url: &broker-url tcp://mosquitto:1883

# Shared simulation values, then the session's clock written by start.sh.
x-env-files: &env-files
  - sim.env
  - path: run.env
    required: false # absent until start.sh has run once

services:
  buildsim:
    # Built straight from the course repository, pinned to one commit so
    # BuildSim can't change underneath the project. No local clone needed.
    build:
      context: https://github.com/eislab-cps/D7065E.git#80a4c5928e675feabe81dd14b490c2123aea2a1b:buildingsim
    command: ["start", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      # Only reachable from this machine; open http://127.0.0.1:9090 for the 3D view.
      - "127.0.0.1:9090:9090"
    restart: on-failure

  mosquitto:
    image: eclipse-mosquitto:2
    # Default config without login, so services can connect without passwords.
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    # Docker starts the broker again if it stops with an error.
    restart: on-failure

  actuator:
    build:
      context: .
      dockerfile: cmd/actuator/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      BUILDSIM_URL: *buildsim-url
    ports:
      # Only reachable from this machine, for sending commands by hand.
      - "127.0.0.1:8080:8080"
    depends_on:
      - buildsim
    # The service exits if BuildSim isn't ready yet at startup; Docker then
    # starts it again.
    restart: on-failure

  co2-sensor:
    build:
      context: .
      dockerfile: cmd/co2-sensor/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      BUILDSIM_URL: *buildsim-url
      MQTT_BROKER_URL: *broker-url
      SENSOR_INTERVAL: 10s
    depends_on:
      - buildsim
      - mosquitto
    # The service exits if BuildSim or the broker isn't ready yet at startup;
    # Docker then starts it again.
    restart: on-failure

  occupancy:
    build:
      context: .
      dockerfile: cmd/occupancy/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      BUILDSIM_URL: *buildsim-url
      OCCUPANCY_INTERVAL: 10s
    depends_on:
      - buildsim
    # The service exits if BuildSim isn't ready yet at startup; Docker then
    # starts it again.
    restart: on-failure

  occupancy-sensor:
    build:
      context: .
      dockerfile: cmd/occupancy-sensor/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      BUILDSIM_URL: *buildsim-url
      MQTT_BROKER_URL: *broker-url
      SENSOR_INTERVAL: 1m
    depends_on:
      - buildsim
      - mosquitto
    # The service exits if BuildSim or the broker isn't ready yet at startup;
    # Docker then starts it again.
    restart: on-failure

  occupancy-forecast:
    build:
      context: .
      dockerfile: cmd/occupancy-forecast/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      STORAGE_URL: http://storage-service:8081
      MQTT_BROKER_URL: *broker-url
      FORECAST_DAYS: 5
    depends_on:
      - mosquitto
      - storage-service
    # The service exits if the broker isn't ready yet at startup; Docker then
    # starts it again. It waits for the storage-service by itself.
    restart: on-failure

  decision:
    build:
      context: .
      dockerfile: cmd/decision/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      MQTT_BROKER_URL: *broker-url
      ACTUATOR_URL: http://actuator:8080
      PLAN_TARGET_PPM: 950
      PLAN_LOWER_MARGIN_PPM: 20
      PLAN_HORIZON: 60m
      FALLBACK_CLOSE_PPM: 800
    depends_on:
      - mosquitto
      - actuator
    # The service exits if the broker isn't ready yet at startup; Docker then
    # starts it again. A refused command is retried on the next reading.
    restart: on-failure

  room-model:
    build:
      context: .
      dockerfile: cmd/room-model/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      STORAGE_URL: http://storage-service:8081
      MQTT_BROKER_URL: *broker-url
      FIT_DAYS: 7
    depends_on:
      - mosquitto
      - storage-service
    # The service exits if the broker isn't ready yet at startup; Docker then
    # starts it again. It waits for the storage-service by itself.
    restart: on-failure

  physical-model:
    build:
      context: .
      dockerfile: cmd/physical-model/Dockerfile
    # Shared values and the session's clock come from x-env-files; the
    # settings below are this service's own wiring.
    env_file: *env-files
    environment:
      BUILDSIM_URL: *buildsim-url
    depends_on:
      - buildsim
    # The service exits if BuildSim isn't ready yet at startup; Docker then
    # starts it again.
    restart: on-failure

  storage-service:
    build:
      context: .
      dockerfile: cmd/storage-service/Dockerfile
    environment:
      MQTT_BROKER_URL: *broker-url
      SQLITE_PATH: /data/storage-service.db
    ports:
      # Only reachable from this machine, for reading stored readings by hand.
      - "127.0.0.1:8081:8081"
    volumes:
      - storage-data:/data
    depends_on:
      - mosquitto
    # The service exits if the broker isn't ready yet at startup; Docker then
    # starts it again.
    restart: on-failure

volumes:
  storage-data:
